# ======================
# SERVER
# ======================

server.port=${PORT:8080}


# ======================
# DATABASE
# ======================

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration


# ======================
# LOGGING
# ======================

logging.level.root=INFO
logging.level.org.springframework=WARN
logging.level.com.example.AgriConnect=INFO

logging.file.name=logs/agriconnect.log


# ======================
# JWT
# ======================

jwt.secret=${JWT_SECRET}
jwt.access.expiration=${JWT_ACCESS_EXPIRATION:3600000}
jwt.refresh.expiration=${JWT_REFRESH_EXPIRATION:604800000}


# ======================
# RAZORPAY
# ======================

razorpay.key=${RAZORPAY_KEY}
razorpay.secret=${RAZORPAY_SECRET}


# ======================
# PHONEPE
# ======================

phonepe.merchant-id=${PHONEPE_MERCHANT_ID:}
phonepe.salt-key=${PHONEPE_SALT_KEY:}
phonepe.salt-index=${PHONEPE_SALT_INDEX:1}

phonepe.host=${PHONEPE_HOST:https://api-preprod.phonepe.com/apis/pg-sandbox}

phonepe.redirect-url=${PHONEPE_REDIRECT_URL:http://localhost:5173/buyer/payment/phonepe/callback}

phonepe.callback-url=${PHONEPE_CALLBACK_URL:http://localhost:8080/api/buyer/payment/phonepe/callback}


# ======================
# WEATHER API
# ======================

weather.api.key=${WEATHER_API_KEY}

weather.api.url=${WEATHER_API_URL:https://api.openweathermap.org/data/2.5/weather}


# ======================
# ACTUATOR
# ======================

management.endpoints.web.exposure.include=health,info


# ======================
# CORS
# ======================

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ======================
# CLOUDINARY
# ======================

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}


# ======================
# KAFKA
# ======================

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

spring.kafka.consumer.group-id=agriconnect
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer

spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.admin.fail-fast=false
spring.kafka.admin.properties.request.timeout.ms=5000
spring.kafka.admin.properties.default.api.timeout.ms=5000
spring.kafka.admin.properties.retries=0


# ======================
# MAIL
# ======================

spring.mail.host=smtp.gmail.com
spring.mail.port=587

spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


# ======================
# REDIS
# ======================

spring.data.redis.host=${REDISHOST:localhost}
spring.data.redis.port=${REDISPORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

